workflows:
  ios-release:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest # <-- set to specific version e.g. 14.3, 15.0 to avoid unexpected updates.
      cocoapods: default
      groups:
        - github_releases
    triggering:
      events:
        - tag
      branch_patterns:
        - pattern: 'v*'
          include: true
          source: true
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter analyze
        script: |
          flutter analyze
      - name: Quick Test Plist lint
        script: |
          plutil -lint ios/Runner/Info.plist
      - name: Flutter build ipa
        script: |
          flutter build ios --profile --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qq -r -9 unsigned-app.ipa Payload

          # Move it to a known location for artifacts
          mkdir -p $CM_BUILD_DIR/artifacts
          mv unsigned-app.ipa $CM_BUILD_DIR/artifacts/soundbrat.ipa
      - name: Publish to GitHub Releases
        # This script runs on every build, but only creates a release when a tag exists
        script: |
          if [ -z "$CM_TAG" ]; then
            echo "No tag detected → skipping GitHub release"
            exit 0
          fi
          echo "Creating GitHub Release for tag $CM_TAG"
          echo $GITHUB_TOKEN | gh auth login --with-token

          # Optional: generate simple release notes from git changelog
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Generating release notes from $PREVIOUS_TAG..$CM_TAG"
            git log --pretty="- %s (%an)" $PREVIOUS_TAG..HEAD > /tmp/release-notes.md
            NOTES_ARG="--notes-file /tmp/release-notes.md"
          else
            NOTES_ARG="--notes Release $CM_TAG"
          fi
          # Create the release and upload the IPA
          gh release create "$CM_TAG" \
            "$CM_BUILD_DIR/artifacts/soundbrat.ipa" \
            --title "soundbrat iOS $CM_TAG" \
            $NOTES_ARG \
            --draft=false

    artifacts:
      - $CM_BUILD_DIR/artifacts/*.ipa
      - build/ios/iphoneos/Runner.app
  
  android-debug:
    name: Android Debug
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: stable
      groups:
        - github_releases
    triggering:
      events:
        - tag
      branch_patterns:
        - pattern: 'v*'
          include: true
          source: true
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build signed debug APK
        script: |
          flutter build apk --debug
          # Create artifacts folder
          mkdir -p $CM_BUILD_DIR/artifacts
          # Copy and rename the debug APK
          cp build/app/outputs/flutter-apk/app-debug.apk \
             $CM_BUILD_DIR/artifacts/soundbrat-debug.apk

      - name: Publish to GitHub Releases
        # This script runs on every build, but only creates a release when a tag exists
        script: |
          if [ -z "$CM_TAG" ]; then
            echo "No tag detected → skipping GitHub release"
            exit 0
          fi

          echo "Creating GitHub Release for tag $CM_TAG"
          echo $GITHUB_TOKEN | gh auth login --with-token

          # Optional: generate simple release notes from git changelog
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Generating release notes from $PREVIOUS_TAG..$CM_TAG"
            git log --pretty="- %s (%an)" $PREVIOUS_TAG..HEAD > /tmp/release-notes.md
            NOTES_ARG="--notes-file /tmp/release-notes.md"
          else
            NOTES_ARG="--notes Release $CM_TAG"
          fi

          # Create the release and upload the IPA
          gh release create "$CM_TAG" \
            --title "soundbrat $CM_TAG" \
            $NOTES_ARG \
            --draft=false

          gh release upload $CM_TAG \
            $CM_BUILD_DIR/artifacts/*.apk

    artifacts:
      - $CM_BUILD_DIR/artifacts/soundbrat-debug.apk
      - build/app/outputs/flutter-apk/app-debug.apk

  windows-release:
    name: Windows Desktop
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - github_releases
      flutter: stable
    triggering:
      events:
        - tag
      branch_patterns:
        - pattern: 'v*'
          include: true
          source: true
    scripts:
      - name: Enable Windows desktop & get packages
        script: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Build Windows
        script: |
          flutter build windows

      - name: Export bundle 
        script: |
          cd build/windows/x64/runner/Release
          7z a -r ../release.zip ./*
      
      - name: Publish to GitHub Releases
        script: |
          # CM_TAG is automatically set when build is triggered by a tag
          if [ -z "$CM_TAG" ]; then
            echo "No tag detected this should not happen (trigger is tag-only)"
            exit 0
          fi
          echo "Creating GitHub Release for tag: $CM_TAG"
          echo $GITHUB_TOKEN | gh auth login --with-token

          # Generate nice release notes from git log (since previous tag)
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Generating changelog from $PREVIOUS_TAG..$CM_TAG"
            git log --pretty=format:"- %s (%h by %an)" $PREVIOUS_TAG..HEAD > /tmp/release-notes.md
            NOTES_ARG="--notes-file /tmp/release-notes.md"
          else
            NOTES_ARG="--notes Released Windows build $CM_TAG"
          fi

          # Create the release and upload the portable ZIP
          gh release create "$CM_TAG" \
            "build\windows\x64\runner\release.zip" \
            --title "soundbrat Windows $CM_TAG" \
            $NOTES_ARG \
            --target $CM_COMMIT_SHA

          echo "GitHub Release $CM_TAG created and ZIP uploaded!"

    artifacts:
      - build\windows\x64\runner\release.zip