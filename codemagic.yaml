workflows:
  ios-release:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest # <-- set to specific version e.g. 14.3, 15.0 to avoid unexpected updates.
      cocoapods: default
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter analyze
        script: |
          flutter analyze
      - name: Quick Test Plist lint
        script: |
          plutil -lint ios/Runner/Info.plist
      - name: Flutter build ipa
        script: |
          flutter build ios --profile --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qq -r -9 unsigned-app.ipa Payload

          # Move it to a known location for artifacts
          mkdir -p $CM_BUILD_DIR/artifacts
          mv unsigned-app.ipa $CM_BUILD_DIR/artifacts/soundbrat.ipa

    artifacts:
      - $CM_BUILD_DIR/artifacts/*.ipa
      - build/ios/iphoneos/Runner.app
  
  android-debug:
    name: Android Debug (Signed)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build signed debug APK
        script: |
          flutter build apk --debug

          # Create artifacts folder
          mkdir -p $CM_BUILD_DIR/artifacts

          # Copy and rename the debug APK
          cp build/app/outputs/flutter-apk/app-debug.apk \
             $CM_BUILD_DIR/artifacts/soundbrat-debug.apk

    artifacts:
      - $CM_BUILD_DIR/artifacts/soundbrat-debug.apk
      - build/app/outputs/flutter-apk/app-debug.apk